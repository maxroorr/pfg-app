name: Build PFG app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      VCODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build with the permanent signing key
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KS_FILE="$RUNNER_TEMP/release.jks" gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk pfg.apk
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest pfg.apk --title "PFG app" --notes "Latest PFG Android app" --latest
